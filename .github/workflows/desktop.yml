name: Alfa COS Desktop CI/CD

on:
  push:
    branches: [ main, master, development, 'v*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, development, 'v*' ]

jobs:
  test-and-build:
    name: Desktop CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System GUI Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 xvfb

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -m pytest tests/ -v

      - name: Run Pytest Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -v

      - name: Build Standalone Desktop Executable
        run: |
          python -m PyInstaller --clean alfa_desktop.spec

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfa-desktop-${{ runner.os }}
          path: dist/
